[project]
name = "nimdaydu-local"
version = "0.2.0"
description = "Private local streaming speech service for NimDaydu"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "moonshine-voice==0.1.5",
  "numpy>=2,<3",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
  "ctranslate2>=4.6,<5",
  "sentencepiece>=0.2,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "websockets>=15,<17"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

